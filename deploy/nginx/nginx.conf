# ----------------------------------------------------------------------
# Description:
#
# Edge reverse proxy for CADRI production. Terminates TLS and routes each
# request to either the backend API or the frontend SPA, depending on the
# path.
#
# Requires:
#   - a real domain name instead of cadri.example.com
#   - a real TLS certificate/key instead of the placeholder paths below
#     (e.g. issued by Certbot/Let's Encrypt)
#   - to run on the same Docker network as the "backend" and "frontend"
#     services defined in docker-compose.prod.yml, so it can reach them
#     by name
# ----------------------------------------------------------------------

upstream cadri_backend {
    server backend:5000;  # the Flask/Gunicorn backend container, reached by its Docker Compose service name
}

upstream cadri_frontend {
    server frontend:80;  # the frontend container's own nginx, serving the built React app
}

# Plain HTTP server: only used to redirect to HTTPS, and to answer ACME
# HTTP-01 challenges when issuing/renewing the TLS certificate.
server {
    listen 80;                      # accept plain HTTP traffic
    server_name cadri.example.com;  # PLACEHOLDER: replace with the real domain

    # Let's Encrypt proves you actually control this domain before issuing
    # or renewing a certificate: Certbot temporarily writes a unique token
    # file under /var/www/certbot, then Let's Encrypt's server requests
    # that exact file over plain HTTP — getting the right content back is
    # what convinces it to hand out the certificate.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;  # must match the path Certbot writes its token file into
    }

    location / {
        return 301 https://$host$request_uri;  # redirect every other request to HTTPS
    }
}

# The real server: everything actual visitors interact with. Terminates
# TLS, adds security headers, then hands each request to the backend or
# the frontend depending on its path (see the location blocks below).
server {
    listen 443 ssl;                 # accept HTTPS traffic
    http2 on;                       # enable HTTP/2 for this server block
    server_name cadri.example.com;  # PLACEHOLDER: replace with the real domain

    ssl_certificate     /etc/nginx/certs/cadri.crt;  # PLACEHOLDER: public certificate, replace with the real one
    ssl_certificate_key /etc/nginx/certs/cadri.key;  # PLACEHOLDER: private key, replace with the real one
    ssl_protocols       TLSv1.2 TLSv1.3;             # only allow modern, secure TLS versions

    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;  # force HTTPS on every future visit
    add_header X-Content-Type-Options "nosniff" always;                                 # stop browsers from guessing a file's content type
    add_header X-Frame-Options "DENY" always;                                           # block this site from being embedded in an <iframe>
    add_header Referrer-Policy "same-origin" always;                                    # don't leak the current URL to other sites via the Referer header

    client_max_body_size 10M;  # reject request bodies larger than 10 MB

    # CADRI's backend has no single shared "/api" prefix — every namespace
    # registered in app/__init__.py is proxied explicitly here.
    location ~ ^/(auth|me|users|metadata|missions|docs|swagger\.json) {  # match any of the backend's route prefixes
        proxy_pass http://cadri_backend;                                 # forward the request to the backend upstream
        proxy_set_header Host $host;                                     # preserve the original Host header
        proxy_set_header X-Real-IP $remote_addr;                         # tell the backend the visitor's real IP
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;     # keep the chain of forwarding IPs
        proxy_set_header X-Forwarded-Proto $scheme;                      # tell the backend the original request used HTTPS
    }

    # Everything else is the React single-page app.
    location / {
        proxy_pass http://cadri_frontend;                             # forward the request to the frontend upstream
        proxy_set_header Host $host;                                  # preserve the original Host header
        proxy_set_header X-Real-IP $remote_addr;                      # tell the frontend container the visitor's real IP
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;  # keep the chain of forwarding IPs
        proxy_set_header X-Forwarded-Proto $scheme;                   # tell the frontend container the original request used HTTPS
    }
}
