# ----------------------------------------------------------------------
# Description:
#
# Production variant of docker-compose.yml. Differences from the dev
# version: no bind-mounted source code (each image is self-contained,
# built from the *.prod Dockerfiles), no directly exposed backend/
# frontend/database ports (only nginx is reachable from outside), and
# restart/health check policies so a crashed container recovers on its
# own instead of staying down.
#
# Requires:
#   - apps/backend/Dockerfile.prod and apps/frontend/Dockerfile.prod to
#     build a working image
#   - a .env file at the repository root, defining POSTGRES_DB,
#     POSTGRES_USER, POSTGRES_PASSWORD and VITE_API_BASE_URL (Compose
#     reads this file automatically to fill in the ${...} values below).
#     VITE_API_BASE_URL must include "/api" (e.g.
#     https://cadri.example.com/api) — see deploy/nginx/nginx.conf for why
#   - a real apps/backend/.env on the server, based on
#     .env.production.example, referenced via env_file below
#   - deploy/nginx/nginx.conf with a real domain, plus a real TLS
#     certificate/key placed where that file expects them
#   - mailpit is intentionally dropped here: it is a fake dev-only mail
#     catcher, production must use a real SMTP server configured through
#     apps/backend/.env instead
# ----------------------------------------------------------------------

services:
  nginx:
    image: nginx:1.27-alpine  # off-the-shelf image is enough, no custom modules needed
    container_name: cadri_nginx
    restart: always  # restart automatically if it crashes or the host reboots
    ports:
      - "80:80"    # the only port reachable from outside this server
      - "443:443"  # the only port reachable from outside this server
    volumes:
      - ./deploy/nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro  # the routing/TLS config, read-only inside the container
      - ./deploy/nginx/certs:/etc/nginx/certs:ro  # PLACEHOLDER: put the real certificate + key here, see nginx.conf
      - certbot_www:/var/www/certbot:ro           # shared with the ACME HTTP-01 challenge path in nginx.conf
    depends_on:
      - backend
      - frontend

  frontend:
    build:
      context: ./apps/frontend
      dockerfile: Dockerfile.prod
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL}  # baked into the JS bundle at build time; must include "/api" (e.g. https://cadri.example.com/api), see nginx.conf
    container_name: cadri_frontend
    restart: always
    # No "ports:" here on purpose — nginx is the only container exposed
    # to the outside world, this one is only reachable on the internal
    # Docker network nginx.conf's upstream block relies on.
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--spider", "http://localhost/"]  # confirm the static server responds
      interval: 30s
      timeout: 5s
      retries: 3

  backend:
    build:
      context: ./apps/backend
      dockerfile: Dockerfile.prod
    container_name: cadri_backend
    restart: always
    env_file:
      - ./apps/backend/.env  # real secrets, based on .env.production.example — never commit this file
    depends_on:
      db:
        condition: service_healthy  # wait for Postgres to accept connections before starting
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5000/auth/health')"]
      interval: 30s
      timeout: 5s
      retries: 3

  db:
    image: postgres:16
    container_name: cadri_db
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB}          # from the root .env file, see "Requires" above
      POSTGRES_USER: ${POSTGRES_USER}      # from the root .env file, see "Requires" above
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}  # PLACEHOLDER: must be a real, strong secret — never hardcoded like in the dev compose file
    # No "ports:" here either — only the backend needs to reach Postgres,
    # and it does so over the internal Docker network, never from outside.
    volumes:
      - cadri_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]  # used by "depends_on: condition: service_healthy" above
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  cadri_postgres_data:  # persists the database across container restarts/recreations
  certbot_www:           # shared scratch space for the Let's Encrypt HTTP-01 challenge files
